
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form URL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form" style="display:block;">
    <h3>Form URL</h3>

    <form>
        <fieldset>
            <legend>URL</legend>

            URL:
            <input type="url" placeholder="Masukkan URL" required>
            <br><br>

            Tanggal:
            <input type="date">
            <br><br>

            Waktu:
            <input type="time">
            <br><br>

            Jumlah:
            <input type="number" min="1" placeholder="Masukkan jumlah">
            <br><br>

            <button type="submit">Send</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</div>

</body>
</html>
